        function saveRecycledIds(r) { localStorage.setItem(STORAGE_KEYS.RECYCLED_IDS, JSON.stringify(r)); }
        function getAuditLogs() { const raw = localStorage.getItem(STORAGE_KEYS.AUDIT_LOGS); return raw ? JSON.parse(raw) : []; }
        function logAudit(action, details) {
            const logs = getAuditLogs();
            const user = getCurrentUser();
            logs.unshift({ time: new Date().toISOString(), user: user ? user.name : 'Sistema', action, details });

        function saveTickets(t) { localStorage.setItem(STORAGE_KEYS.TICKETS, JSON.stringify(t)); }

        function generateNextTicketId(ticketType) {
            let prefix = 'AVE';
            if (ticketType === 'Tickets de Backbone') prefix = 'BKN';
            if (ticketType === 'Tickets de Requerimiento') prefix = 'RQM';
            const recycled = getRecycledIds();
            if (recycled[prefix] && recycled[prefix].length > 0) {
                recycled[prefix].sort((a, b) => a - b);
                const recycledNum = recycled[prefix].shift();
                saveRecycledIds(recycled);
                return `${prefix}-${recycledNum}`;
            }
            return `${prefix}-${Math.floor(10000 + Math.random() * 90000)}`;
        }

        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const baseClass = "pointer-events-none px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-3 border transition-all transform translate-y-2 opacity-0";
            const typeClass = type === 'success' 
                ? "bg-white text-slate-800 border-green-500/30 dark:bg-[#0a110c] dark:text-white dark:border-green-500" 
                : "bg-white text-slate-800 border-rose-500/30 dark:bg-rose-950 dark:text-white dark:border-rose-600";
            toast.className = `${baseClass} ${typeClass}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 ${type === 'success' ? 'text-green-500' : 'text-rose-500'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        let currentView = 'dashboard';
        let tempMaterials = [];

        function getElapsedTime(startIso, endIso = null) {
            if (!startIso) return { text: '0h 0m', ms: 0 };
            const start = new Date(startIso);
            const end = endIso ? new Date(endIso) : new Date();
            const diffMs = end - start;
            if (diffMs < 0) return { text: '0h 0m', ms: 0 };
            const hrs = Math.floor(diffMs / (1000 * 60 * 60));
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            return { text: `${hrs}h ${mins}m`, ms: diffMs };
        }

            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
            renderApp();
        }

        function confirmDeleteTicket(id) {
            let tickets = getTickets();
            const ticketToDelete = tickets.find(t => t.id === id);
            if (ticketToDelete && ticketToDelete.id) {
                const parts = ticketToDelete.id.split('-');
                if (parts.length === 2) {
                    const prefix = parts[0];
                    const num = parseInt(parts[1], 10);
                    if (!isNaN(num)) {
                        const recycled = getRecycledIds();
                        if (!recycled[prefix]) recycled[prefix] = [];
                        if (!recycled[prefix].includes(num)) {
                            recycled[prefix].push(num);
                            saveRecycledIds(recycled);
                        }
                    }
                }
            }
            tickets = tickets.filter(t => t.id !== id);
            saveTickets(tickets);
            logAudit('DELETE_TICKET', `Ticket ${id} eliminado y su ID reciclado`);
            closeModal();
            renderApp();
            showToast(`Ticket ${id} eliminado. ID reciclado.`, 'success');
        }

        function updateTicketIdPrefix(ticketType) {
            const displayEl = document.getElementById('display-ticket-id');
            if(displayEl) displayEl.innerText = generateNextTicketId(ticketType);
        }

        function renderInputGroup(label, id, type, options = null, val = '', placeholder = '', step = '', required = true) {
            const baseClass = "w-full bg-slate-50 dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none font-medium";
            let inputHtml = '';
            const reqAttr = required ? 'required' : '';
            if (type === 'select' && options) {
                let opts = options.map(o => `<option value="${o}">${o}</option>`).join('');
                if (!required) opts = `<option value="">Seleccione... (Opcional)</option>` + opts;
                inputHtml = `<select id="${id}" ${reqAttr} class="${baseClass}">${opts}</select>`;
            } else {
                inputHtml = `<input type="${type}" id="${id}" ${reqAttr} value="${val}" placeholder="${placeholder}" step="${step}" class="${baseClass}">`;
            }
            return `<div><label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">${label}</label>${inputHtml}</div>`;
        }

        function handleCreateTicketSubmit(e) {
            e.preventDefault();
            const tickets = getTickets();
            const customId = document.getElementById('display-ticket-id').innerText;
            const reqDateVal = document.getElementById('reg-request-date').value;

            const newTicket = {
                id: customId,
                requestDate: reqDateVal ? new Date(reqDateVal).toISOString() : new Date().toISOString(),
                createdAt: new Date().toISOString(),
                ticketType: document.getElementById('reg-ticket-type').value,
                category: document.getElementById('reg-category').value,
                reportArea: document.getElementById('reg-report-area').value,
                affectedClients: parseInt(document.getElementById('reg-clients').value) || 3,
                elementType: document.getElementById('reg-eltype').value.trim(),
                elementCode: document.getElementById('reg-elcode').value.trim(),
                coords: { lat: parseFloat(document.getElementById('reg-lat').value) || -12.0464, lng: parseFloat(document.getElementById('reg-lng').value) || -77.0428 },
                nodo: document.getElementById('reg-nodo').value.trim().toUpperCase(),
                project: document.getElementById('reg-project').value.trim().toUpperCase(),
                distrito: document.getElementById('reg-distrito').value.trim().toUpperCase(),
                zone: document.getElementById('reg-zone').value.trim().toUpperCase(),
                details: document.getElementById('reg-details').value.trim(),
                status: 'pendiente',
                supervisor: document.getElementById('reg-supervisor').value || null,
                contractor: document.getElementById('reg-contractor').value || null,
                brigada: document.getElementById('reg-brigada').value.trim(),
                closureData: null
            };
            tickets.unshift(newTicket);
            saveTickets(tickets);
            logAudit('CREATE_TICKET', `Registro de nuevo ticket ${customId}`);
            showToast(`Ticket ${customId} registrado correctamente.`, 'success');
            switchView('dashboard');
        }

        function openEditTicketModal(ticketId) {
            const ticket = getTickets().find(t => t.id === ticketId);
            if (!ticket) return;
            const supervisors = getUsers().filter(u => u.role !== 'noc' && u.role !== 'tecnico');
            const catalogs = getCatalogs();

            openModal(`
                <div class="bg-white dark:bg-[#0a110c] rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-[#122b1c] max-h-[90vh] overflow-y-auto">

                            ${renderInputGroup('Nodo', 'ed-nodo', 'text', null, ticket.nodo)}
                        </div>
                        <div class="grid grid-cols-2 gap-3">

                            ${renderInputGroup('Brigada', 'ed-brigada', 'text', null, ticket.brigada)}
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            ${renderInputGroup('Supervisor', 'ed-sup', 'select', supervisors.map(s => s.name), '', '', '', false)}
                            ${renderInputGroup('Contratista', 'ed-con', 'select', catalogs.contractors, '', '', '', false)}

                if (document.getElementById('ed-con')) document.getElementById('ed-con').value = ticket.contractor || '';

        function handleEditSubmit(e, id) {
            e.preventDefault();
            const tickets = getTickets();
            const t = tickets.find(x => x.id === id);
            t.affectedClients = parseInt(document.getElementById('ed-clients').value) || 1;
            t.elementType = document.getElementById('ed-eltype').value.trim();
            t.elementCode = document.getElementById('ed-elcode').value.trim();
            t.nodo = document.getElementById('ed-nodo').value.trim().toUpperCase();
            t.distrito = document.getElementById('ed-distrito').value.trim().toUpperCase();
            t.brigada = document.getElementById('ed-brigada').value.trim();
            t.supervisor = document.getElementById('ed-sup').value || null;
            t.contractor = document.getElementById('ed-con').value || null;
            saveTickets(tickets);
            logAudit('EDIT_TICKET', `Actualización de datos del ticket ${id}`);
            showToast('Ticket actualizado con éxito', 'success');
            closeModal();
            renderApp();
        }

        function updateTicketStatus(id, stat) {

        function buildTelegramFormat(t) {
            return `TICKET:  ${t.id}\nFECHA DE SOLICITUD:  ${formatCustomDate(t.requestDate || t.createdAt)}\nAREA QUE REPORTA:  ${(t.reportArea||'').toUpperCase()}\nMOTIVO:  ${(t.ticketType||'').toUpperCase()}\nCATEGORIA:  ${(t.category||'').toUpperCase()}\nCLIENTES AFECTADOS:  ${t.affectedClients}\nELEMENTO:  ${(t.elementType||'').toUpperCase()}\nCODIGO:  ${t.elementCode||''}\nCOORDENADAS:  ${t.coords.lat}, ${t.coords.lng}\nNODO:  ${t.nodo}\nPROYECTO:  ${t.project}\nDISTRITO:  ${t.distrito}\nZONA:  ${t.zone}\nDETALLES:  "${t.details}"\nSUPERVISOR:  ${t.supervisor}\nCONTRATISTA:  ${t.contractor}\nBRIGADA:  ${t.brigada}`;
        }

        function formatCustomDate(iso) {
            if(!iso) return '';
            const d = new Date(iso);
            if(isNaN(d.getTime())) return iso;
            return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function addClosureMaterial() {
            const select = document.getElementById('mat-select');
            const qtyInput = document.getElementById('mat-qty');
            const name = select.value;
            const qty = parseInt(qtyInput.value);
            if (!name || isNaN(qty) || qty <= 0) return showToast('Seleccione material y cantidad', 'error');
            const existingIdx = tempMaterials.findIndex(m => m.name === name);
            if (existingIdx > -1) tempMaterials[existingIdx].qty += qty;
            else tempMaterials.push({ name, qty });
            select.value = '';
            qtyInput.value = '';
            renderClosureMaterialsList();
        }

        function removeClosureMaterial(idx) {
            tempMaterials.splice(idx, 1);
            renderClosureMaterialsList();
        }

        function renderClosureMaterialsList() {
            const listEl = document.getElementById('closure-materials-list');
            if (tempMaterials.length === 0) {
                listEl.innerHTML = '<p class="text-[10px] text-slate-500 italic">No hay materiales agregados.</p>';
                return;
            }
            listEl.innerHTML = tempMaterials.map((m, idx) => `
                <div class="flex items-center justify-between bg-white dark:bg-[#0a110c] p-2 rounded border border-slate-200 dark:border-[#122b1c] text-xs">
                    <span><strong>${m.qty}x</strong> ${m.name}</span>

                </div>
            `).join('');
            lucide.createIcons();
        }

        function handleClosure(e, id) {
            e.preventDefault();
            const tickets = getTickets();
            const t = tickets.find(x => x.id === id);
            t.status = 'finalizado';
            const safeRead = (elemId) => { const el = document.getElementById(elemId); return el ? el.value : ''; };
            const isGisShown = document.getElementById('gis-closure-section') && !document.getElementById('gis-closure-section').classList.contains('hidden');

            t.closureData = {
                startTime: safeRead('cl-start') || '08:00',
                endTime: safeRead('cl-end') || '10:00',
                cause: safeRead('cl-cause') || 'Sin Causa',
                solution: safeRead('cl-sol') || 'Sin Solución',
                materials: [...tempMaterials],
                gisCatastro: isGisShown ? { status: safeRead('cl-gis-status'), kmz: safeRead('cl-gis-kmz') } : null,
                closedAt: new Date().toISOString()
            };
            saveTickets(tickets);
            logAudit('CLOSE_TICKET', `Cierre exitoso del ticket ${id}`);
            showToast(`Ticket ${id} cerrado correctamente.`, 'success');
            closeModal();
            renderApp();
        }

                                <select id="u-role" class="w-full bg-slate-50 dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] rounded-xl px-3 py-2 text-xs text-slate-900 dark:text-white focus:outline-none">
                                    <option value="supervisor">Supervisor</option>
                                    <option value="noc">NOC</option>
                                    <option value="tecnico">Técnico Campo</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-600 font-bold">Cancelar</button>
                            <button type="submit" class="px-5 py-2 bg-winet-600 text-white font-bold rounded-xl">Crear Usuario</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function saveNewUser(e) {
            e.preventDefault();
            const users = getUsers();
            const newUser = {
                id: `u_${Date.now()}`,
                name: document.getElementById('u-name').value.trim(),
                email: document.getElementById('u-email').value.trim(),
                pass: document.getElementById('u-pass').value.trim(),
                role: document.getElementById('u-role').value,
                docId: '40000000',
                phone: '+51 900000000',
                avatar: 'https://placehold.co/150x150/16a34a/ffffff?text=U'
            };
            users.push(newUser);
            saveUsers(users);
            logAudit('CREATE_USER', `Creado usuario ${newUser.email}`);
            closeModal();
            renderApp();
            showToast('Usuario creado con éxito', 'success');
        }

        function deleteUser(id) {
            saveUsers(getUsers().filter(u => u.id !== id));
            logAudit('DELETE_USER', `Eliminado usuario ID ${id}`);
            renderApp();
            showToast('Usuario eliminado', 'success');
        }

        function renderAuditView() {
            const logs = getAuditLogs();
            return `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="flex justify-between items-center bg-white dark:bg-[#0a110c] p-5 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm">
                        <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2"><i data-lucide="shield-alert" class="text-winet-500"></i> Registro de Auditoría del Sistema</h2>
                        <button onclick="switchView('dashboard')" class="px-4 py-2 bg-white dark:bg-[#0a110c] border border-slate-200 dark:border-[#122b1c] rounded-xl text-xs font-semibold shadow-sm">Volver</button>
                    </div>
                    <div class="bg-white dark:bg-[#0a110c] rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm overflow-hidden p-6">
                        <div class="space-y-2 max-h-[500px] overflow-y-auto">
                            ${logs.map(l => `
                                <div class="flex justify-between items-center p-3 rounded-xl bg-slate-50 dark:bg-[#020503] border border-slate-100 dark:border-[#122b1c] text-xs font-mono">
                                    <div>
                                        <span class="font-bold text-winet-600 dark:text-winet-400">[\${l.action}]</span> 
                                        <span class="text-slate-700 dark:text-stone-300 ml-2">\${l.details}</span>
                                        <div class="text-[10px] text-slate-400 mt-0.5">Usuario: \${l.user}</div>
                                    </div>
                                    <span class="text-[10px] text-slate-400">\${formatCustomDate(l.time)}</span>
                                </div>
                            `).join('') || '<p class="text-xs text-slate-400 text-center py-8">No hay registros de auditoría aún.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function exportToCSV() {
            const tickets = getTickets();
            if(tickets.length === 0) return showToast('No hay datos', 'error');
            const headers = ['ID Ticket', 'Fecha Solicitud', 'Estado', 'Clientes', 'Nodo', 'Distrito', 'Supervisor', 'Contratista'];
            const rows = tickets.map(t => [t.id, t.requestDate || '', t.status, t.affectedClients, t.nodo, t.distrito, t.supervisor || '', t.contractor || '']);
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.map(String).map(s=>`"${s.regexReplace ? s : s.replace(/"/g, '""')}"`).join(','))].join('\n');
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `WINET_PEXT_CLOUD_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            logAudit('EXPORT_CSV', 'Exportación de base de tickets a CSV');
            showToast('CSV Descargado', 'success');
        }

        window.onload = function() { renderApp(); };
    </script>
</body>
</html>
