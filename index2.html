        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            // Adaptive toast based on mode using Tailwind dark: modifiers
            const baseClass = "pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-semibold flex items-center gap-3 border transition-all transform translate-y-2 opacity-0";
            const typeClass = type === 'success' 
                ? "bg-white text-slate-800 border-green-500/30 dark:bg-[#0a110c] dark:text-white dark:border-green-500" 
                : "bg-white text-slate-800 border-rose-500/30 dark:bg-rose-950 dark:text-white dark:border-rose-600";
            
            const iconColor = type === 'success' ? 'text-green-500' : 'text-rose-500';
            
            toast.className = `${baseClass} ${typeClass}`;
            toast.innerHTML = `<i data-lucide="${type === 'success' ? 'check-circle-2' : 'alert-circle'}" class="w-5 h-5 ${iconColor}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // Calculadora de Tiempo Transcurrido (SLA)
        function getElapsedTime(startIso, endIso = null) {
            if (!startIso) return { text: '0h 0m', ms: 0 };
            const start = new Date(startIso);
            const end = endIso ? new Date(endIso) : new Date();
            const diffMs = end - start;
            if (diffMs < 0) return { text: '0h 0m', ms: 0 };
            const hrs = Math.floor(diffMs / (1000 * 60 * 60));
            const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            return { text: `${hrs}h ${mins}m`, ms: diffMs };
        }

        function initDashboardMap() {
            const mapEl = document.getElementById('pext-map');
            if (!mapEl) return;
            if (mapInstance) { mapInstance.remove(); mapInstance = null; }

            const tickets = getTickets();
            const validCoords = tickets.filter(t => t.coords && typeof t.coords.lat === 'number');
            const centerLat = validCoords.length > 0 ? validCoords[0].coords.lat : -12.0464;
            const centerLng = validCoords.length > 0 ? validCoords[0].coords.lng : -77.0428;

            mapInstance = L.map('pext-map').setView([centerLat, centerLng], 10);

            // CHANGED: Using the standard OpenStreetMap tile layer (100% free, no API key)
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(mapInstance);

            tickets.forEach(t => {
                if (t.coords && t.coords.lat) {
                    const marker = L.marker([t.coords.lat, t.coords.lng]).addTo(mapInstance);
                    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.coords.lat},${t.coords.lng}`;
                    marker.bindPopup(`
                        <div class="p-1 font-sans text-sm">
                            <strong class="text-winet-700">${t.id}</strong><br>
                            Nodo: ${t.nodo}<br>
                            <a href="${googleMapsUrl}" target="_blank" class="mt-2 inline-block px-2 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600">Abrir en Google Maps ↗</a>
                        </div>
                    `);
                }
            });
        }

                    opts = `<option value="">Seleccione... (Opcional)</option>` + opts;

                inputHtml = `<select id="${id}" ${reqAttr} class="${baseClass}">${opts}</select>`;
            } else {
                inputHtml = `<input type="${type}" id="${id}" ${reqAttr} value="${val}" placeholder="${placeholder}" step="${step}" class="${baseClass}">`;
            }

        function initDashboardMap() {
            const mapEl = document.getElementById('pext-map');
            if (!mapEl) return;
            if (mapInstance) { mapInstance.remove(); mapInstance = null; }

            const tickets = getTickets();
            const validCoords = tickets.filter(t => t.coords && typeof t.coords.lat === 'number' && !isNaN(t.coords.lat));
            const centerLat = validCoords.length > 0 ? validCoords[0].coords.lat : -12.0464;
            const centerLng = validCoords.length > 0 ? validCoords[0].coords.lng : -77.0428;

            mapInstance = L.map('pext-map').setView([centerLat, centerLng], 10);

            // CHANGED: Using Esri World Street Map (100% Free, Reliable, No API Key, No 403 Errors)
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, iPC, NAVTEQ, TomTom, Intermap'
            }).addTo(mapInstance);

            tickets.forEach(t => {
                if (t.coords && t.coords.lat && !isNaN(t.coords.lat)) {
                    const marker = L.marker([t.coords.lat, t.coords.lng]).addTo(mapInstance);
                    const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.coords.lat},${t.coords.lng}`;
                    marker.bindPopup(`
                        <div class="p-1 font-sans text-sm">
                            <strong class="text-winet-700 dark:text-winet-500">${t.id}</strong><br>
                            Nodo: <span class="font-semibold text-slate-800 dark:text-slate-200">${t.nodo}</span><br>
                            <a href="${googleMapsUrl}" target="_blank" class="mt-2 inline-block px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition-colors">Abrir en Google Maps ↗</a>
                        </div>
                    `);
                }
            });
        }

            const searchQ = document.getElementById('ts-search').value.toLowerCase();

            items.forEach(item => {
                const searchableText = item.getAttribute('data-search') || '';
                const status = item.getAttribute('data-status') || '';
                
                const matchSearch = searchableText.includes(searchQ);
                const matchStatus = statusF === 'all' || status === statusF;
                
                if (matchSearch && matchStatus) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function saveUser(e, id, isNew) {
            e.preventDefault();

            const newUser = {

                email: document.getElementById('u-email').value.trim(),

        function exportToCSV() {
            const tickets = getTickets();
            if(tickets.length === 0) return showToast('No hay datos para exportar', 'error');
            const headers = ['ID Ticket', 'Fecha Creación', 'Tipo Avería', 'Categoría', 'Área Reporta', 'Estado', 'Clientes Afectados', 'Nodo', 'Distrito', 'Supervisor', 'Contratista', 'Brigada', 'Latitud', 'Longitud'];
            const rows = tickets.map(t => [t.id, t.createdAt, t.ticketType, t.category, t.reportArea, t.status, t.affectedClients, t.nodo, t.distrito, t.supervisor || '', t.contractor || '', t.brigada || '', t.coords?.lat || '', t.coords?.lng || '']);
            const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.map(String).map(s=>`"${s.replace(/"/g, '""')}"`).join(','))].join('\n');
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `WINET_PEXT_Reporte_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('CSV Descargado exitosamente', 'success');
        }

        // --- FUNCIONALIDAD DE COLAS Y ASIGNACIÓN (KANBAN) ---
        function renderQueuesView() {
            const tickets = getTickets();
            const users = getUsers();
            const supervisors = [...new Set([
                ...users.filter(u => u.role !== 'noc' && u.role !== 'admin').map(u => u.name),
                ...tickets.map(t => t.supervisor).filter(Boolean)
            ])].sort();

            const columns = ['Sin Asignar', ...supervisors];

            // Analítica rápida de la cola actual
            const activeTickets = tickets.filter(t => t.status !== 'finalizado');
            let totalElapsedMs = 0;
            let maxElapsedMs = 0;
            activeTickets.forEach(t => {
                const elapsed = getElapsedTime(t.createdAt).ms;
                totalElapsedMs += elapsed;
                if (elapsed > maxElapsedMs) maxElapsedMs = elapsed;
            });
            const avgElapsed = activeTickets.length > 0 ? getElapsedTime(new Date(Date.now() - (totalElapsedMs / activeTickets.length)).toISOString()).text : '0h 0m';
            const maxElapsed = getElapsedTime(new Date(Date.now() - maxElapsedMs).toISOString()).text;

            return `
                <div class="h-[calc(100vh-140px)] flex flex-col space-y-4">
                    <div class="flex justify-between items-start lg:items-center flex-col lg:flex-row gap-4">
                        <div>
                            <h2 class="text-2xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                                <i data-lucide="kanban" class="text-winet-500"></i> Gestión de Colas y Asignación
                            </h2>
                            <p class="text-sm text-slate-500 dark:text-stone-400 mt-1">Tabla de gestión horizontal por supervisor. Cierre o reasigne tickets directamente desde la lista.</p>
                        </div>
                        <div class="flex gap-4">
                            <div class="bg-white dark:bg-[#0a110c] px-4 py-2 rounded-xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col items-center">
                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tickets Activos</span>
                                <span class="text-lg font-black text-slate-800 dark:text-white">${activeTickets.length}</span>
                            </div>
                            <div class="bg-white dark:bg-[#0a110c] px-4 py-2 rounded-xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col items-center">
                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tiempo Promedio</span>
                                <span class="text-lg font-black text-amber-600 dark:text-amber-500">${avgElapsed}</span>
                            </div>
                            <div class="bg-white dark:bg-[#0a110c] px-4 py-2 rounded-xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col items-center hidden sm:flex">
                                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Tiempo Máximo</span>
                                <span class="text-lg font-black text-rose-600 dark:text-rose-500">${maxElapsed}</span>
                            </div>
                        </div>
                        <button onclick="switchView('dashboard')" class="px-4 py-2 bg-white dark:bg-[#0a110c] border border-slate-200 dark:border-[#122b1c] rounded-xl text-sm font-semibold shadow-sm hover:bg-slate-50 dark:hover:bg-[#122b1c] transition-colors">Volver</button>
                    </div>
                    
                    <div class="flex-1 flex gap-5 overflow-x-auto pb-4 custom-scrollbar">
                        ${columns.map(sup => {
                            const supTickets = tickets.filter(t => (sup === 'Sin Asignar' && !t.supervisor) || t.supervisor === sup);
                            return `
                                <div class="min-w-[400px] w-[450px] max-h-full flex flex-col bg-slate-50 dark:bg-[#050a07] rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm">
                                    <div class="p-4 border-b border-slate-200 dark:border-[#122b1c] bg-white dark:bg-[#0a110c] rounded-t-2xl flex justify-between items-center sticky top-0 z-10">
                                        <h3 class="font-bold text-slate-800 dark:text-white text-sm flex items-center gap-2">
                                            <i data-lucide="${sup === 'Sin Asignar' ? 'inbox' : 'user'}" class="w-4 h-4 ${sup === 'Sin Asignar' ? 'text-amber-500' : 'text-winet-500'}"></i> ${sup}
                                        </h3>
                                        <span class="bg-slate-200 text-slate-700 dark:bg-[#122b1c] dark:text-stone-300 text-xs px-2.5 py-1 rounded-full font-bold">${supTickets.length}</span>
                                    </div>
                                    <div class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                                        ${supTickets.length > 0 
                                            ? supTickets.map(t => renderQueueCard(t, supervisors)).join('') 
                                            : `<div class="text-center text-xs text-slate-400 dark:text-stone-500 py-6 border-2 border-dashed border-slate-200 dark:border-[#122b1c] rounded-xl">No hay tickets en esta bandeja</div>`
                                        }
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderQueueCard(t, supervisors) {
            let typeColor = 'border-l-emerald-500';
            let badgeBg = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-400';
            
            if (t.ticketType === 'Tickets de Backbone') {
                typeColor = 'border-l-indigo-500';
                badgeBg = 'bg-indigo-100 text-indigo-800 dark:bg-indigo-500/10 dark:text-indigo-400';
            } else if (t.ticketType === 'Tickets de Requerimiento') {
                typeColor = 'border-l-purple-500';
                badgeBg = 'bg-purple-100 text-purple-800 dark:bg-purple-500/10 dark:text-purple-400';
            }

            const elapsedInfo = t.status === 'finalizado' ? getElapsedTime(t.createdAt, t.closureData.closedAt) : getElapsedTime(t.createdAt);
            const isCritical = t.status !== 'finalizado' && elapsedInfo.ms > (4 * 60 * 60 * 1000); // Resaltar si pasa de 4 horas
            const timeColorClass = t.status === 'finalizado' ? 'text-winet-600 dark:text-winet-500' : (isCritical ? 'text-rose-600 dark:text-rose-500' : 'text-amber-600 dark:text-amber-500');

            return `
                <div class="bg-white dark:bg-[#0a110c] p-4 rounded-xl border border-slate-200 dark:border-[#122b1c] shadow-sm hover:shadow-md transition-shadow border-l-4 ${typeColor} flex flex-col gap-3 relative group">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="font-mono font-bold text-slate-900 dark:text-white text-sm">${t.id}</span>
                            <div class="text-xs font-semibold text-slate-700 dark:text-stone-300 line-clamp-1 mt-0.5">${t.nodo} • ${t.distrito}</div>
                        </div>

        function addClosureMaterial() {
            const select = document.getElementById('mat-select');
            const qtyInput = document.getElementById('mat-qty');
            const name = select.value;
            const qty = parseInt(qtyInput.value);

            if (!name || isNaN(qty) || qty <= 0) return showToast('Seleccione un material y cantidad válida', 'error');

            const existingIdx = tempMaterials.findIndex(m => m.name === name);
            if (existingIdx > -1) {
                tempMaterials[existingIdx].qty += qty;
            } else {
                tempMaterials.push({ name, qty });
            }

            select.value = '';
            qtyInput.value = '';
            renderClosureMaterialsList();
        }

        function removeClosureMaterial(idx) {
            tempMaterials.splice(idx, 1);
            renderClosureMaterialsList();
        }

        function renderClosureMaterialsList() {
            const listEl = document.getElementById('closure-materials-list');
            if (tempMaterials.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-slate-500 italic">No hay materiales registrados aún.</p>';
                return;

                    <span class="text-slate-700 dark:text-stone-300"><strong class="text-slate-900 dark:text-white">${m.qty}x</strong> ${m.name}</span>

        // --- IMPORTACIÓN INTELIGENTE DE EXCEL (SheetJS) ---
        function importExcelDatabase(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            
            showToast('Procesando archivo Excel, por favor espere...', 'success');

            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheet = workbook.SheetNames[0];
                    const rows = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                    
                    if(rows.length === 0) return showToast('El archivo Excel no contiene datos (está vacío).', 'error');

                    const tickets = getTickets();
                    let importedCount = 0;

                    rows.forEach(row => {
                        // Función helper para encontrar columnas independientemente de mayúsculas o espacios
                        const getVal = (keywords) => {
                            const key = Object.keys(row).find(k => keywords.some(kw => k.toLowerCase().includes(kw)));
                            return key ? row[key] : '';
                        };

                        const newId = getVal(['id', 'ticket', 'codigo', 'ticketid']) || `AVE-${Math.floor(100000 + Math.random() * 900000)}`;
                        
                        // Evitar duplicidad
                        if(tickets.find(t => t.id === String(newId))) return;

                        let lat = parseFloat(getVal(['latitud', 'lat', 'y']));
                        let lng = parseFloat(getVal(['longitud', 'lng', 'lon', 'x']));
                        
                        const t = {
                            id: String(newId),
                            createdAt: getVal(['fecha', 'creacion', 'date', 'inicio']) || new Date().toISOString(),
                            ticketType: getVal(['tipo', 'motivo', 'averia']) || 'Avería Clientes Loss',
                            category: getVal(['categoria', 'cat']) || 'AVERIA',
                            reportArea: getVal(['reporta', 'area', 'origen']) || 'Calidad Operativa',
                            affectedClients: parseInt(getVal(['afectados', 'clientes'])) || 1,
                            elementType: getVal(['elemento', 'tipo_elemento']) || 'CAJA CTO',
                            elementCode: getVal(['codigo_elemento', 'code', 'codigo']) || 'S/N',
                            coords: { lat: isNaN(lat) ? -12.0464 : lat, lng: isNaN(lng) ? -77.0428 : lng },
                            nodo: getVal(['nodo', 'olt']) || 'SIN NODO',
                            project: getVal(['proyecto', 'project', 'troncal']) || 'N/A',
                            distrito: getVal(['distrito', 'ciudad']) || 'LIMA',
                            zone: getVal(['zona', 'region', 'area']) || 'LIMA',
                            details: getVal(['detalles', 'observacion', 'comentario']) || 'Importado desde archivo maestro Excel.',
                            status: getVal(['estado', 'estatus', 'status'])?.toLowerCase() === 'finalizado' ? 'finalizado' : 'pendiente',
                            supervisor: getVal(['supervisor', 'encargado', 'lider']) || null,
                            contractor: getVal(['contratista', 'empresa']) || null,
                            brigada: getVal(['brigada', 'cuadrilla', 'tecnico']) || null,
                            closureData: null
                        };

                        if (t.status === 'finalizado') {
                            t.closureData = {
                                startTime: getVal(['hora_inicio', 'inicio_trabajo']) || '08:00',
                                endTime: getVal(['hora_fin', 'fin_trabajo']) || '10:00',
                                cause: getVal(['causa', 'raiz', 'falla']) || 'Causa no especificada',
                                solution: getVal(['solucion', 'accion', 'reparacion']) || 'Solución no especificada',
                                closedAt: t.createdAt
                            };
                        }

                        tickets.push(t);
                        importedCount++;
                    });

                    saveTickets(tickets);
                    showToast(`Éxito: ${importedCount} Tickets importados a la base de datos maestra.`, 'success');
                    renderApp();
                    
                } catch(err) {
                    console.error("Error importando Excel:", err);
                    showToast('Ocurrió un error al leer la estructura del archivo Excel.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value = ''; // Limpiar el input para permitir volver a subir el mismo archivo si es necesario
        }

                                            <th class="p-3 border-b border-slate-200 dark:border-[#122b1c]">Material</th>
                                            <th class="p-3 border-b border-slate-200 dark:border-[#122b1c] text-center">Cant.</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 dark:divide-[#122b1c]">
                                        ${filteredTickets.length > 0 ? filteredTickets.flatMap(t => t.closureData.materials.map(m => `
                                            <tr class="hover:bg-slate-50 dark:hover:bg-[#030a05]">
                                                <td class="p-3 text-slate-600 dark:text-stone-400">${formatCustomDate(t.closureData.closedAt)}</td>
                                                <td class="p-3 font-mono font-bold text-slate-900 dark:text-white">${t.id}</td>
                                                <td class="p-3 text-slate-700 dark:text-stone-300">${t.contractor || 'Interno'}</td>
                                                <td class="p-3 text-slate-700 dark:text-stone-300">${m.name}</td>
                                                <td class="p-3 text-center font-bold text-winet-600 dark:text-winet-500">${m.qty}</td>
                                            </tr>
                                        `)).join('') : `<tr><td colspan="5" class="p-8 text-center text-slate-400">Sin registros detallados.</td></tr>`}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function printLiquidationFormat() {
            const filterM = document.getElementById('liq-month').value;
            const filterY = document.getElementById('liq-year').value;
            const filterC = document.getElementById('liq-contractor').value;
            
            if (filterC === 'all') return showToast('Por favor, seleccione un Contratista específico para generar el acta.', 'error');
            
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const periodStr = filterM === 'all' ? `Todo el Año ${filterY}` : `${monthNames[parseInt(filterM)]} ${filterY}`;
            
            const tickets = getTickets().filter(t => t.status === 'finalizado' && t.closureData && t.closureData.materials && t.contractor === filterC);
            const materialSummary = {};
            tickets.forEach(t => {
                if(t.closureData.closedAt) {
                    const d = new Date(t.closureData.closedAt);
                    if((filterM === 'all' || d.getMonth().toString() === filterM) && d.getFullYear().toString() === filterY) {
                        t.closureData.materials.forEach(m => {
                            if (!materialSummary[m.name]) materialSummary[m.name] = 0;
                            materialSummary[m.name] += parseInt(m.qty);
                        });
                    }
                }
            });

            if (Object.keys(materialSummary).length === 0) return showToast('No hay materiales liquidados para este filtro.', 'error');

            const printWindow = window.open('', '_blank', 'width=900,height=700');
            printWindow.document.write(`
                <html>
                <head>
                    <title>Acta de Liquidación - ${filterC}</title>
                    <style>
                        body { font-family: 'Arial', sans-serif; padding: 40px; color: #333; }
                        .header { text-align: center; border-bottom: 2px solid #16a34a; padding-bottom: 20px; margin-bottom: 30px; }
                        .header h1 { margin: 0; color: #16a34a; font-size: 24px; text-transform: uppercase; }
                        .header p { margin: 5px 0 0 0; font-size: 14px; color: #666; }
                        .meta-info { display: flex; justify-content: space-between; margin-bottom: 30px; font-size: 14px; }
                        table { w-full; border-collapse: collapse; margin-bottom: 40px; width: 100%; }
                        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; font-size: 13px; }
                        th { background-color: #f8fafc; color: #333; text-transform: uppercase; font-size: 12px; }
                        .qty-col { text-align: center; font-weight: bold; width: 150px; }
                        .signatures { display: flex; justify-content: space-around; margin-top: 80px; }
                        .sig-box { text-align: center; width: 250px; }
                        .sig-line { border-top: 1px solid #333; margin-bottom: 10px; }
                        .sig-box p { margin: 0; font-size: 12px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>Acta de Liquidación de Materiales PEXT</h1>
                        <p>Red de Fibra Óptica - Telecomunicaciones</p>
                    </div>
                    
                    <div class="meta-info">
                        <div>
                            <strong>Contratista:</strong> ${filterC}<br><br>
                            <strong>Periodo de Ejecución:</strong> ${periodStr}
                        </div>
                        <div style="text-align: right;">
                            <strong>Fecha de Impresión:</strong> ${formatCustomDate(new Date().toISOString())}<br><br>
                            <strong>Generado por:</strong> ${getCurrentUser().name}
                        </div>
                    </div>

                    <h3>Resumen Consolidado de Materiales Utilizados</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Ítem / Descripción del Material</th>
                                <th class="qty-col">Cantidad Consumida</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(materialSummary).sort((a,b)=>b[1]-a[1]).map(([mat, qty]) => `
                                <tr>
                                    <td>${mat}</td>
                                    <td class="qty-col">${qty}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>

                    <p style="font-size: 12px; color: #666;">* El presente documento tiene carácter de declaración jurada respecto al consumo real en planta externa durante el periodo señalado. Los materiales detallados han sido rebajados del inventario virtual.</p>

                    <div class="signatures">
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <p><strong>Firma y Sello Contratista</strong></p>
                            <p>${filterC}</p>
                        </div>
                        <div class="sig-box">
                            <div class="sig-line"></div>
                            <p><strong>Conformidad Operaciones WINET</strong></p>
                            <p>Supervisión PEXT</p>
                        </div>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 500);
        }

        // --- ANALÍTICA AVANZADA E INDICADORES (POWER BI STYLE) ---
        let analyticsCharts = []; // Variable global para destruir instancias previas
        
        function renderAnalyticsView() {
            const tickets = getTickets();
            const total = tickets.length;
            const finalized = tickets.filter(t => t.status === 'finalizado').length;
            const clientsAffected = tickets.reduce((acc, t) => acc + (parseInt(t.affectedClients) || 0), 0);
            
            // Calculo de SLA Promedio (Tiempo de solución)
            let totalHours = 0;
            let slaTickets = 0;
            tickets.forEach(t => {
                if(t.status === 'finalizado' && t.closureData?.closedAt && t.createdAt) {
                    const diff = new Date(t.closureData.closedAt) - new Date(t.createdAt);
                    if(diff > 0) { totalHours += (diff / (1000 * 60 * 60)); slaTickets++; }
                }
            });
            const avgSLA = slaTickets > 0 ? (totalHours / slaTickets).toFixed(2) : '0.00';

            // Generar meses dinámicos basados en la data existente para el select
            const monthsAvailable = [...new Set(tickets.map(t => new Date(t.createdAt).getMonth()))].sort((a,b)=>a-b);
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            return `
                <div class="space-y-6">
                    <!-- Cabecera y Filtros -->
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-white dark:bg-[#0a110c] p-5 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm gap-4">
                        <h2 class="text-xl font-black text-slate-900 dark:text-white flex items-center gap-2">
                            <i data-lucide="bar-chart-2" class="text-winet-500"></i> Indicadores y Métricas (Power BI)
                        </h2>
                        <div class="flex flex-wrap gap-3">
                            <select id="ana-month" onchange="initAnalyticsCharts()" class="bg-slate-50 dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] rounded-lg px-4 py-2 text-sm font-semibold text-slate-800 dark:text-white focus:outline-none focus:border-winet-500">
                                <option value="all">Todos los Meses</option>
                                ${monthsAvailable.map(m => `<option value="${m}">${monthNames[m]}</option>`).join('')}
                            </select>
                            <select id="ana-year" onchange="initAnalyticsCharts()" class="bg-slate-50 dark:bg-[#020503] border border-slate-300 dark:border-[#122b1c] rounded-lg px-4 py-2 text-sm font-semibold text-slate-800 dark:text-white focus:outline-none focus:border-winet-500">
                                <option value="all">Todos los Años</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                            </select>
                            <button onclick="exportToCSV()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-sm font-bold flex items-center gap-2 transition-all shadow-md">
                                <i data-lucide="download" class="w-4 h-4"></i> Exportar Data
                            </button>
                        </div>
                    </div>

                    <!-- Tarjetas de KPI -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="ana-kpis">
                        ${renderKpiCard('Total Histórico', total, 'ticket', 'text-blue-500', 'bg-blue-50 text-blue-600 dark:bg-blue-500/10')}
                        ${renderKpiCard('Tickets Finalizados', finalized, 'check-circle-2', 'text-winet-500', 'bg-winet-50 text-winet-600 dark:bg-winet-500/10')}
                        ${renderKpiCard('SLA Promedio', avgSLA + ' H', 'clock', 'text-purple-500', 'bg-purple-50 text-purple-600 dark:bg-purple-500/10')}
                        ${renderKpiCard('Total Afectados', clientsAffected.toLocaleString(), 'users', 'text-amber-500', 'bg-amber-50 text-amber-600 dark:bg-amber-500/10')}
                    </div>

                    <!-- Gráficos Principales -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white dark:bg-[#0a110c] p-6 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-6 uppercase tracking-wider">Evolución: Averías vs SLA Promedio</h3>
                            <div class="flex-1 min-h-[250px] relative"><canvas id="chart-timeline"></canvas></div>
                        </div>
                        <div class="bg-white dark:bg-[#0a110c] p-6 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-6 uppercase tracking-wider">Tickets por Categoría</h3>
                            <div class="flex-1 min-h-[250px] relative flex justify-center"><canvas id="chart-category"></canvas></div>
                        </div>
                    </div>

                    <!-- Gráficos Secundarios -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                         <div class="bg-white dark:bg-[#0a110c] p-6 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-6 uppercase tracking-wider">Top 5 Causas Raíz (Frecuencia)</h3>
                            <div class="flex-1 min-h-[200px] relative"><canvas id="chart-causes"></canvas></div>
                        </div>
                         <div class="bg-white dark:bg-[#0a110c] p-6 rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm flex flex-col">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white mb-6 uppercase tracking-wider">Tickets por Zona / Región</h3>
                            <div class="flex-1 min-h-[200px] relative"><canvas id="chart-zones"></canvas></div>
                        </div>
                    </div>
                    
                    <!-- Data Table Maestra Interactiva -->
                    <div class="bg-white dark:bg-[#0a110c] rounded-2xl border border-slate-200 dark:border-[#122b1c] shadow-sm overflow-hidden flex flex-col">
                        <div class="p-5 border-b border-slate-200 dark:border-[#122b1c] bg-slate-50 dark:bg-[#030905]">
                            <h3 class="text-sm font-bold text-slate-800 dark:text-white uppercase tracking-wider">Registros Detallados (Data Table)</h3>
                        </div>
                        <div class="overflow-x-auto custom-scrollbar p-2">
                            <table class="w-full text-left border-collapse text-xs whitespace-nowrap">
                                <thead>
                                    <tr class="text-slate-500 dark:text-stone-400 font-bold uppercase tracking-wider border-b border-slate-200 dark:border-[#122b1c]">
                                        <th class="p-3 pl-5">ID Ticket</th>
                                        <th class="p-3">Fecha de Reporte</th>
                                        <th class="p-3">Motivo / Tipo</th>
                                        <th class="p-3">Nodo Afectado</th>
                                        <th class="p-3 text-center">Afectados</th>
                                        <th class="p-3">Estatus</th>
                                        <th class="p-3">Contratista</th>
                                        <th class="p-3">Causa Raíz</th>
                                    </tr>
                                </thead>
                                <tbody id="ana-table-body">
                                    <!-- Rellenado por initAnalyticsCharts -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        // Motor de Renderizado y Filtrado de Gráficos (Chart.js)
        function initAnalyticsCharts() {
            // Limpiar lienzos anteriores
            analyticsCharts.forEach(c => c.destroy());
            analyticsCharts = [];

            const tickets = getTickets();
            const filterM = document.getElementById('ana-month')?.value || 'all';
            const filterY = document.getElementById('ana-year')?.value || 'all';

            // Lógica de Filtrado Activo
            const filtered = tickets.filter(t => {
                if(!t.createdAt) return false;
                const d = new Date(t.createdAt);
                if (filterM !== 'all' && d.getMonth().toString() !== filterM) return false;
                if (filterY !== 'all' && d.getFullYear().toString() !== filterY) return false;
                return true;
            });

            // 1. Data Línea de Tiempo (Por Mes/Año)
            const timeMap = {};
            filtered.forEach(t => {
                const d = new Date(t.createdAt);
                const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                if(!timeMap[k]) timeMap[k] = { tickets: 0, clients: 0 };
                timeMap[k].tickets++;
                timeMap[k].clients += (parseInt(t.affectedClients) || 0);
            });
            const timeKeys = Object.keys(timeMap).sort();

            // 2. Data Categorías (Anillo)
            const catMap = {};
            filtered.forEach(t => catMap[t.category] = (catMap[t.category]||0) + 1);

            // 3. Data Top Causas Raíz (Barras Horizontales)
            const causeMap = {};
            filtered.forEach(t => {
                if(t.closureData?.cause) causeMap[t.closureData.cause] = (causeMap[t.closureData.cause]||0) + 1;
            });
            const topCauses = Object.entries(causeMap).sort((a,b)=>b[1]-a[1]).slice(0,5); // Solo las Top 5

            // 4. Data por Zonas (Barras Verticales)
            const zoneMap = {};
            filtered.forEach(t => zoneMap[t.zone] = (zoneMap[t.zone]||0) + 1);

            // Configuraciones de UI Global de Chart.js adaptadas al Tema Claro/Oscuro
            const isDark = document.documentElement.classList.contains('dark');
            const gridColor = isDark ? '#1f2937' : '#e2e8f0';
            Chart.defaults.color = isDark ? '#94a3b8' : '#64748b';
            Chart.defaults.font.family = 'Inter';

            // Dibujar Gráfico 1: Timeline
            const ctxTimeline = document.getElementById('chart-timeline')?.getContext('2d');
            if(ctxTimeline) analyticsCharts.push(new Chart(ctxTimeline, {
                type: 'line',
                data: {
                    labels: timeKeys,
                    datasets: [
                        { label: 'Volumen de Tickets', data: timeKeys.map(k => timeMap[k].tickets), borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', fill: true, tension: 0.4, borderWidth: 3 },
                        { label: 'Clientes Afectados', data: timeKeys.map(k => timeMap[k].clients), borderColor: '#3b82f6', borderDash: [5,5], tension: 0.4, yAxisID: 'y1', borderWidth: 2 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'top' } },
                    scales: { 
                        x: { grid: { color: gridColor } },
                        y: { beginAtZero: true, grid: { color: gridColor } }, 
                        y1: { position: 'right', beginAtZero: true, grid: { drawOnChartArea: false } } 
                    }
                }
            }));

            // Dibujar Gráfico 2: Categorías
            const ctxCat = document.getElementById('chart-category')?.getContext('2d');
            if(ctxCat) analyticsCharts.push(new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap),
                    datasets: [{ data: Object.values(catMap), backgroundColor: ['#16a34a', '#0ea5e9', '#8b5cf6', '#f59e0b', '#ec4899'], borderWidth: 0, cutout: '70%' }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            }));

            // Dibujar Gráfico 3: Causas
            const ctxCause = document.getElementById('chart-causes')?.getContext('2d');
            if(ctxCause) analyticsCharts.push(new Chart(ctxCause, {
                type: 'bar',
                data: {
                    labels: topCauses.map(c => c[0].length > 25 ? c[0].substring(0,25)+'...' : c[0]),
                    datasets: [{ label: 'Nº Ocurrencias', data: topCauses.map(c => c[1]), backgroundColor: '#16a34a', borderRadius: 4 }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, scales: { x: { grid: { color: gridColor } }, y: { grid: { display: false } } }, plugins: { legend: { display: false } } }
            }));

            // Dibujar Gráfico 4: Zonas
            const ctxZone = document.getElementById('chart-zones')?.getContext('2d');
            if(ctxZone) analyticsCharts.push(new Chart(ctxZone, {
                type: 'bar',
                data: {
                    labels: Object.keys(zoneMap),
                    datasets: [{ label: 'Tickets por Zona', data: Object.values(zoneMap), backgroundColor: '#0ea5e9', borderRadius: 4 }]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { grid: { color: gridColor } }, x: { grid: { display: false } } }, plugins: { legend: { display: false } } }
            }));

            // Actualizar la Tabla Maestra Visual (limitando a 100 para no saturar el DOM en Data grande)
            const tBody = document.getElementById('ana-table-body');
            if(tBody) {
                tBody.innerHTML = filtered.slice(0, 100).map(t => {
                    let statusColor = 'bg-amber-100 text-amber-700 dark:bg-amber-500/10 dark:text-amber-400';
                    if(t.status === 'en_proceso') statusColor = 'bg-sky-100 text-sky-700 dark:bg-sky-500/10 dark:text-sky-400';
                    if(t.status === 'finalizado') statusColor = 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/10 dark:text-emerald-400';

                    return `
                    <tr class="border-b border-slate-100 dark:border-[#122b1c] hover:bg-slate-50 dark:hover:bg-[#030a05] transition-colors">
                        <td class="p-3 pl-5 font-mono text-winet-600 dark:text-winet-500 font-bold">${t.id}</td>
                        <td class="p-3 text-slate-700 dark:text-stone-300">${formatCustomDate(t.createdAt)}</td>
                        <td class="p-3 text-slate-700 dark:text-stone-300">${t.ticketType}</td>
                        <td class="p-3 font-semibold text-slate-900 dark:text-white">${t.nodo}</td>
                        <td class="p-3 text-center text-slate-700 dark:text-stone-300 font-bold">${t.affectedClients}</td>
                        <td class="p-3"><span class="px-2.5 py-1 rounded text-[10px] font-bold uppercase tracking-wider ${statusColor}">${t.status.replace('_',' ')}</span></td>
                        <td class="p-3 text-slate-700 dark:text-stone-300">${t.contractor || '-'}</td>
                        <td class="p-3 text-slate-500 dark:text-stone-500 truncate max-w-[200px]" title="${t.closureData?.cause || 'N/A'}">${t.closureData?.cause || 'N/A'}</td>
                    </tr>
                `}).join('') + (filtered.length > 100 ? `<tr><td colspan="8" class="p-4 text-center text-xs text-slate-400 dark:text-stone-500">Mostrando los primeros 100 registros que coinciden con el filtro. Utilice 'Exportar Data' para ver los ${filtered.length} tickets completos.</td></tr>` : '');
            }
        }

        window.onload = function() { setTheme(currentTheme); renderApp(); };
    </script>
</body>
</html>
